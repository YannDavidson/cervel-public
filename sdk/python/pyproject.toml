[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cervel-public"
version = "0.1.0a2"
description = "Public CERVEL experimental contracts, typed models, local validation, and developer sandbox."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
validation = ["jsonschema==4.25.1"]
sandbox = ["jsonschema==4.25.1"]

[project.scripts]
cervel = "cervel_public.cli:main"

[project.urls]
Homepage = "https://cervel.ai"
Repository = "https://github.com/YannDavidson/cervel-public"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["cervel_public*"]
exclude = ["tests*"]

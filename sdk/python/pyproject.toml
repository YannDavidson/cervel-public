[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cervel-public"
version = "0.1.0a0"
description = "Typed convenience models for CERVEL public experimental interoperability drafts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = { text = "Apache-2.0" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["cervel_public*"]
exclude = ["tests*"]

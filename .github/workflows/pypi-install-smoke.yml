name: PyPI install smoke

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/python-quickstart.md"
      - "examples/python/**"
      - ".github/workflows/pypi-install-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pypi-install:
    name: Install published SDK from PyPI and run public examples
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository examples
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Create clean verification environment
        run: python -m venv /tmp/cervel-pypi-venv

      - name: Install exact published package and validation extra from PyPI
        run: |
          /tmp/cervel-pypi-venv/bin/python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --index-url https://pypi.org/simple \
            'cervel-public[validation]==0.1.0a1'

      - name: Verify package identity, import location, and local validation
        shell: bash
        run: |
          cd /tmp
          /tmp/cervel-pypi-venv/bin/python - <<'PY'
          import importlib.metadata
          import pathlib

          import cervel_public
          from cervel_public import CaptureEnvelope, validate_capture_envelope

          version = importlib.metadata.version("cervel-public")
          module_path = pathlib.Path(cervel_public.__file__).resolve()
          workspace = pathlib.Path("${{ github.workspace }}").resolve()

          assert version == "0.1.0a1", version
          assert workspace not in module_path.parents, module_path

          capture = CaptureEnvelope(
              content="The design review is scheduled for Friday.",
              content_type="text/plain",
              title="Synthetic project note",
          )
          validate_capture_envelope(capture)

          print(f"Verified cervel-public {version}")
          print(f"Imported from {module_path}")
          print("Validated CaptureEnvelope locally against the published schema")
          PY

      - name: Run every public example against PyPI-installed package
        shell: bash
        run: |
          mapfile -t examples < <(find "$GITHUB_WORKSPACE/examples/python" -maxdepth 1 -type f -name '*.py' | sort)
          test "${#examples[@]}" -gt 0
          cd /tmp
          for example in "${examples[@]}"; do
            echo "Running ${example#$GITHUB_WORKSPACE/}"
            /tmp/cervel-pypi-venv/bin/python "$example"
          done

name: Public conformance

on:
  pull_request:
    paths:
      - "conformance/**"
      - "schemas/**"
      - "sdk/python/**"
      - "examples/python/**"
      - "governance/**"
      - "docs/python-quickstart.md"
      - "docs/releases/**"
      - "CHANGELOG.md"
      - "RELEASING.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "DCO.md"
      - "GOVERNANCE.md"
      - ".github/workflows/conformance.yml"
      - ".github/workflows/dco.yml"
  push:
    branches:
      - main
    paths:
      - "conformance/**"
      - "schemas/**"
      - "sdk/python/**"
      - "examples/python/**"
      - "governance/**"
      - "docs/python-quickstart.md"
      - "docs/releases/**"
      - "CHANGELOG.md"
      - "RELEASING.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "DCO.md"
      - "GOVERNANCE.md"
      - ".github/workflows/conformance.yml"
      - ".github/workflows/dco.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate public schemas, SDK, examples, and governance tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            conformance/requirements.txt
            sdk/python/requirements-build.txt

      - name: Install validation and build dependencies
        run: python -m pip install --disable-pip-version-check -r conformance/requirements.txt -r sdk/python/requirements-build.txt

      - name: Run public conformance validator
        run: python conformance/validator.py

      - name: Run Python SDK source schema-conformance tests
        run: python sdk/python/tests/test_conformance.py

      - name: Build Python SDK wheel and source distribution
        run: python -m build --no-isolation --sdist --wheel --outdir sdk/python/dist sdk/python

      - name: Verify Python SDK distribution contents
        run: python sdk/python/tests/test_distribution.py

      - name: Install built wheel without network access
        run: |
          python -m venv /tmp/cervel-sdk-venv
          /tmp/cervel-sdk-venv/bin/python -m pip install --disable-pip-version-check --no-index --no-deps sdk/python/dist/*.whl

      - name: Smoke-test installed wheel outside source tree
        run: cd /tmp && /tmp/cervel-sdk-venv/bin/python "$GITHUB_WORKSPACE/sdk/python/tests/smoke_installed.py"

      - name: Execute every published Python example against installed wheel
        shell: bash
        run: |
          mapfile -t examples < <(find "$GITHUB_WORKSPACE/examples/python" -maxdepth 1 -type f -name '*.py' | sort)
          test "${#examples[@]}" -gt 0
          cd /tmp
          for example in "${examples[@]}"; do
            echo "Running ${example#$GITHUB_WORKSPACE/}"
            /tmp/cervel-sdk-venv/bin/python "$example"
          done

      - name: Test DCO checker behavior
        run: python -m unittest discover -s governance/tests -v
